<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Browser</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }

#screen {
  width: 100%;
  height: calc(100% - 44px);
  object-fit: contain;
  display: block;
}

#toolbar {
  height: 44px;
  display: flex;
  align-items: center;
  background: #1a1a1a;
  padding: 0 8px;
  gap: 6px;
}

#toolbar button {
  width: 32px; height: 32px;
  border: none; border-radius: 6px;
  background: #333; color: #fff;
  font-size: 16px;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
#toolbar button:active { background: #555; }

#url-bar {
  flex: 1;
  height: 30px;
  border: none; border-radius: 6px;
  background: #333; color: #fff;
  padding: 0 10px;
  font-size: 14px;
  outline: none;
  -webkit-appearance: none;
}

#status {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #666; font-size: 18px; font-family: system-ui;
  pointer-events: none;
  z-index: 10;
}
#status.hidden { display: none; }

#keyboard-input {
  position: fixed; top: -100px; left: -100px;
  width: 1px; height: 1px;
  opacity: 0;
}

#tab-panel {
  display: none;
  position: fixed; bottom: 44px; left: 0; right: 0;
  max-height: 60%;
  background: #1a1a1a;
  border-top: 1px solid #444;
  overflow-y: auto;
  z-index: 20;
  -webkit-overflow-scrolling: touch;
}
#tab-panel.show { display: block; }
.tab-item {
  padding: 12px 16px;
  border-bottom: 1px solid #333;
  color: #fff;
  font-size: 14px;
  font-family: system-ui;
  -webkit-tap-highlight-color: transparent;
}
.tab-item:active { background: #333; }
.tab-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab-url { color: #888; font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<div id="status">连接中...</div>
<img id="screen" alt="">
<div id="toolbar">
  <button id="btn-back">◀</button>
  <button id="btn-forward">▶</button>
  <button id="btn-refresh">↻</button>
  <input id="url-bar" type="url" placeholder="输入网址..." enterkeyhint="go">
  <button id="btn-tabs">⊞</button>
  <button id="btn-keyboard">⌨</button>
</div>

<div id="tab-panel"></div>
<input id="keyboard-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

<script>
const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const wsPort = location.protocol === 'https:' ? '' : ':8271';
const WS_URL = location.hash.slice(1) || `${wsProto}//${location.hostname}${wsPort}${location.pathname}`;

const screen = document.getElementById('screen');
const status = document.getElementById('status');
const urlBar = document.getElementById('url-bar');
const keyboardInput = document.getElementById('keyboard-input');
let ws = null;
let viewportW = 390, viewportH = 844;
let reconnectTimer = null;

function connect() {
  status.textContent = '连接中...';
  status.classList.remove('hidden');

  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    status.classList.add('hidden');
    const w = window.innerWidth;
    const h = window.innerHeight - 44;
    // Do not map taps using dimensions left over from the previous desktop
    // session while the relay applies this phone-sized viewport.
    viewportW = w;
    viewportH = h;
    send({ type: 'resize', width: w, height: h });
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'frame') {
      screen.src = 'data:image/jpeg;base64,' + msg.data;
    } else if (msg.type === 'init') {
      // The init packet may still describe the previous client's desktop
      // viewport. Keep touch coordinates tied to this phone and reconfirm it.
      viewportW = window.innerWidth;
      viewportH = window.innerHeight - 44;
      send({ type: 'resize', width: viewportW, height: viewportH });
      if (msg.url) urlBar.value = msg.url;
    } else if (msg.type === 'tabs') {
      // 标题/URL 来自任意网页，必须走 textContent，不能拼 HTML
      tabPanel.innerHTML = '';
      msg.tabs.forEach(t => {
        const item = document.createElement('div');
        item.className = 'tab-item';
        const title = document.createElement('div');
        title.className = 'tab-title';
        title.textContent = t.title || '(无标题)';
        const url = document.createElement('div');
        url.className = 'tab-url';
        url.textContent = t.url;
        item.appendChild(title);
        item.appendChild(url);
        item.onclick = () => {
          send({ type: 'switch_tab', id: t.id });
          tabPanel.classList.remove('show');
        };
        tabPanel.appendChild(item);
      });
      tabPanel.classList.add('show');
    }
  };

  ws.onclose = () => {
    status.textContent = '已断开，重连中...';
    status.classList.remove('hidden');
    reconnectTimer = setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// --- Touch → coordinates mapped to viewport ---
function screenCoords(e) {
  const rect = screen.getBoundingClientRect();
  const touch = e.changedTouches ? e.changedTouches[0] : e;
  const scaleX = viewportW / rect.width;
  const scaleY = viewportH / rect.height;
  return {
    x: Math.round((touch.clientX - rect.left) * scaleX),
    y: Math.round((touch.clientY - rect.top) * scaleY),
  };
}

let touchStart = null;
let touchStartTime = 0;
let scrolling = false;
let dragging = false;
let lastTouchY = 0;
let lastTouchX = 0;

screen.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const c = screenCoords(e);
  touchStart = c;
  touchStartTime = Date.now();
  lastTouchX = c.x;
  lastTouchY = c.y;
  scrolling = false;
  dragging = false;
}, { passive: false });

screen.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const c = screenCoords(e);
  const dx = c.x - lastTouchX;
  const dy = c.y - lastTouchY;
  const totalX = c.x - touchStart.x;
  const totalY = c.y - touchStart.y;
  // A deliberate horizontal gesture is a real pointer drag (sliders,
  // carousels, canvas controls). Vertical movement remains page scrolling.
  if (!dragging && !scrolling && Math.abs(totalX) > 10 && Math.abs(totalX) > Math.abs(totalY) * 1.5) {
    dragging = true;
    send({ type: 'drag_start', x: touchStart.x, y: touchStart.y });
  }
  if (dragging) {
    send({ type: 'drag_move', x: c.x, y: c.y });
    lastTouchX = c.x;
    lastTouchY = c.y;
    return;
  }
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
    scrolling = true;
    send({ type: 'scroll', x: c.x, y: c.y, deltaX: -dx * 2, deltaY: -dy * 2 });
    lastTouchX = c.x;
    lastTouchY = c.y;
  }
}, { passive: false });

screen.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (dragging) {
    const c = screenCoords(e);
    send({ type: 'drag_end', x: c.x, y: c.y });
  } else if (!scrolling && touchStart) {
    const elapsed = Date.now() - touchStartTime;
    if (elapsed < 300) {
      send({ type: 'tap', x: touchStart.x, y: touchStart.y });
      // 点击后自动弹键盘，方便输入
      setTimeout(() => keyboardInput.focus(), 100);
    }
  }
  touchStart = null;
  scrolling = false;
  dragging = false;
}, { passive: false });

// Mouse fallback for testing on desktop
screen.addEventListener('click', (e) => {
  if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
  const c = screenCoords(e);
  send({ type: 'tap', x: c.x, y: c.y });
});

// --- Toolbar ---
document.getElementById('btn-back').onclick = () => send({ type: 'back' });
document.getElementById('btn-forward').onclick = () => send({ type: 'forward' });
document.getElementById('btn-refresh').onclick = () => send({ type: 'refresh' });

urlBar.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    let url = urlBar.value.trim();
    if (url && !url.match(/^https?:\/\//)) url = 'https://' + url;
    send({ type: 'navigate', url });
    urlBar.blur();
  }
});

// --- Tab switching ---
const tabPanel = document.getElementById('tab-panel');
document.getElementById('btn-tabs').onclick = () => {
  if (tabPanel.classList.contains('show')) {
    tabPanel.classList.remove('show');
  } else {
    send({ type: 'list_tabs' });
  }
};

// --- Keyboard input ---
document.getElementById('btn-keyboard').onclick = () => {
  keyboardInput.focus();
};

keyboardInput.addEventListener('input', (e) => {
  const text = e.data;
  if (text) {
    send({ type: 'type', text });
  }
});

keyboardInput.addEventListener('keydown', (e) => {
  if (['Backspace', 'Enter', 'Tab', 'Escape', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
    send({ type: 'keypress', key: e.key });
    e.preventDefault();
  }
});

// --- Start ---
connect();

// Send viewport size on orientation change
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight - 44;
  viewportW = w;
  viewportH = h;
  send({ type: 'resize', width: w, height: h });
});
</script>
</body>
</html>
